name: Build Windows installer

# Qo'lda ishga tushirish: Actions -> Build Windows installer -> Run workflow
# yoki "v2.3.0" kabi teg yuborilganda avtomatik ishlaydi.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check project files
        shell: bash
        run: |
          missing=0
          for f in package.json main.js preload.js serve.js encoder.js build/icon.ico build/icon.png app/index.html app/js/app.js app/js/subtitles.js app/js/audio-utils.js app/js/pcm-capture.worklet.js app/css/app.css app/css/base.css app/css/icons.css; do
            if [ ! -f "$f" ]; then echo "YETISHMAYAPTI: $f"; missing=1; fi
          done
          count=$(find app -type f | wc -l)
          echo "app/ ichidagi fayllar soni: $count (kutilgan: 8)"
          if [ "$missing" = "1" ] || [ "$count" -lt 8 ]; then
            echo "XATO: loyiha fayllari to'liq yuklanmagan. Zip ichidagi barcha papkalarni (.github, app, build) to'liq yuklang."
            echo "Eslatma: eski versiyadagi fayllar qolib ketgan bo'lsa, repozitoriyani tozalab, yangi fayllarni yuklang."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Check MP3 encoder (ffmpeg) was downloaded
        shell: bash
        run: |
          node -e "const p=require('ffmpeg-static'); const fs=require('fs'); if(!p||!fs.existsSync(p)){console.error('XATO: ffmpeg yuklanmadi — MP3 yozuv ishlamaydi'); process.exit(1);} console.log('ffmpeg:', p)"

      - name: Build .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShadowingStudio-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
