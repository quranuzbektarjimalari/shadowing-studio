<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Shadowing Studio — PDF + Audio</title>

  <!-- Mahalliy bazaviy uslublar (Tailwind o'rniga) -->
  <link rel="stylesheet" href="./css/base.css" />

  <!-- Ikonkalar (Font Awesome Free, CSS mask) -->
  <link rel="stylesheet" href="./css/icons.css" />

  <!-- PDF.js (mahalliy nusxa) -->
  <script type="module" src="./js/pdfjs-loader.mjs"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* =========================================================
       PDF VIEWER
    ========================================================= */

    #pdfContainer {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #1f2937;
      cursor: grab;
      scrollbar-width: thin;
      scrollbar-color: #475569 #1f2937;
      user-select: none;
    }

    #pdfContainer.dragging {
      cursor: grabbing;
    }

    #pdfPageWrapper {
      /* Keng (zoom qilingan) sahifalar ham chapga kesilmasdan scroll bo'lishi uchun */
      width: max-content;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 24px 100px;
    }

    /* Barcha sahifalar ketma-ket bitta uzun vertikal ro'yxatda */
    #pdfPagesList {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #pdfPagesList.hidden {
      display: none;
    }

    .pdf-page {
      position: relative;
      flex: none;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .pdf-page-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 600;
      color: #cbd5e1;
      pointer-events: none;
    }

    .pdf-page canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =========================================================
       GENERAL PDF BUTTON
    ========================================================= */

    .pdf-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 9px;

      border-radius: 7px;
      border: 1px solid #475569;

      background: #334155;
      color: white;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      cursor: pointer;
      transition: 0.15s;

      font-size: 13px;
    }

    .pdf-btn:hover:not(:disabled) {
      background: #475569;
    }

    .pdf-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .pdf-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* =========================================================
       AUDIO PAGE CONTROL
    ========================================================= */

    .pdf-page-control {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .audio-page-input {
      width: 42px;
      height: 32px;

      border: 1px solid #475569;
      border-radius: 7px;

      background: #1e293b;
      color: white;

      text-align: center;
      outline: none;

      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .audio-page-input:focus {
      border-color: #38bdf8;
    }

    .audio-page-input::-webkit-inner-spin-button,
    .audio-page-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .audio-page-input[type="number"] {
      -moz-appearance: textfield;
    }

    .audio-page-count {
      min-width: 24px;
      color: #cbd5e1;
      font-size: 12px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .page-separator {
      color: #64748b;
      font-size: 12px;
    }

    .player-divider {
      width: 1px;
      height: 25px;
      background: #475569;
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* =========================================================
       AUDIO PLAYER
    ========================================================= */

    #audioPlayerBar {
      position: fixed;

      left: 50%;
      bottom: 8px;

      transform: translateX(-50%);

      z-index: 1000;

      min-height: 56px;
      max-width: calc(100vw - 16px);

      padding: 7px 10px;

      display: flex;
      align-items: center;
      gap: 7px;

      background: rgba(30, 41, 59, 0.96);

      border: 1px solid rgba(100, 116, 139, 0.75);
      border-radius: 16px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.45),
        0 3px 10px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      white-space: nowrap;
    }

    .audio-btn {
      flex-shrink: 0;

      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 8px;

      background: #334155;
      color: white;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        background 0.15s,
        transform 0.1s,
        opacity 0.15s;
    }

    .audio-btn:hover:not(:disabled) {
      background: #475569;
    }

    .audio-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .audio-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #0ea5e9;

      box-shadow:
        0 4px 12px rgba(14, 165, 233, 0.3);
    }

    .play-btn:hover:not(:disabled) {
      background: #38bdf8;
    }

    .audio-btn.active {
      background: #10b981;
      color: white;
    }

    .audio-btn.danger:hover:not(:disabled) {
      background: #dc2626;
    }

    #currentTime,
    #duration {
      flex-shrink: 0;
      width: 38px;

      font-size: 11px;
      color: #cbd5e1;

      font-variant-numeric: tabular-nums;
    }

    #currentTime {
      text-align: right;
    }

    #duration {
      text-align: left;
    }

    #progress {
      width: 360px;
      min-width: 100px;
    }

    #volume {
      width: 55px;
    }

    .audio-range {
      height: 4px;
      cursor: pointer;
      accent-color: #38bdf8;
    }

    #speedBtn {
      min-width: 43px;
      padding: 0 7px;

      font-size: 12px;
      font-weight: bold;
    }

    #audioStatus {
      min-width: 35px;
      max-width: 150px;

      font-size: 11px;
      font-weight: bold;

      color: #38bdf8;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       RESPONSIVE PLAYER
    ========================================================= */

    @media (max-width: 1100px) {
      #progress {
        width: 260px;
      }

      #audioStatus {
        max-width: 100px;
      }
    }

    @media (max-width: 850px) {
      #audioPlayerBar {
        gap: 5px;
        padding: 6px 8px;
      }

      #progress {
        width: 180px;
      }

      #volume {
        width: 42px;
      }

      #audioStatus {
        display: none;
      }
    }

    @media (max-width: 650px) {
      #audioPlayerBar {
        width: calc(100vw - 10px);
        max-width: calc(100vw - 10px);

        bottom: 5px;

        overflow-x: auto;
        overflow-y: hidden;

        border-radius: 13px;

        scrollbar-width: none;
      }

      #audioPlayerBar::-webkit-scrollbar {
        display: none;
      }

      #progress {
        width: 130px;
        min-width: 130px;
      }

      #volume {
        width: 38px;
        min-width: 38px;
      }

      .audio-btn {
        width: 33px;
        height: 33px;
      }

      .play-btn {
        width: 37px;
        height: 37px;
      }

      #currentTime,
      #duration {
        width: 34px;
        font-size: 10px;
      }

      .audio-page-input {
        width: 38px;
      }

      #pdfPageWrapper {
        padding: 16px 16px 100px;
      }
    }
  
    /* =========================================================
       PLAYLIST
    ========================================================= */

    #playlistBtn {
      position: relative;
    }

    #playlistBadge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: #0ea5e9;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
      display: none;
      pointer-events: none;
    }

    #playlistPanel {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      z-index: 999;
      width: min(460px, calc(100vw - 16px));
      max-height: min(50vh, 420px);
      display: flex;
      flex-direction: column;
      background: rgba(30, 41, 59, 0.98);
      border: 1px solid rgba(100, 116, 139, 0.75);
      border-radius: 14px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.45),
        0 3px 10px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
    }

    #playlistPanel.hidden {
      display: none;
    }

    .playlist-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid #334155;
    }

    #playlistTitle {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pl-btn {
      flex: none;
      border: 0;
      border-radius: 8px;
      background: #334155;
      color: #ffffff;
      font-size: 12px;
      padding: 6px 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .pl-btn:hover:not(:disabled) {
      background: #475569;
    }

    .pl-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .pl-btn.on {
      background: #0ea5e9;
    }

    #playlistList {
      list-style: none;
      margin: 0;
      padding: 4px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 13px;
    }

    .playlist-item:hover {
      background: #334155;
    }

    .playlist-item.current {
      background: rgba(14, 165, 233, 0.18);
      color: #ffffff;
    }

    .playlist-num {
      flex: none;
      width: 22px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .playlist-item.current .playlist-num {
      color: #38bdf8;
    }

    .playlist-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .playlist-remove {
      flex: none;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
    }

    .playlist-remove:hover {
      background: #475569;
      color: #ffffff;
    }

    .playlist-empty {
      padding: 18px 10px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
  
    /* =========================================================
       DROP OVERLAY
    ========================================================= */

    #dropOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.82);
      pointer-events: none;
    }

    #dropOverlay.show {
      display: flex;
    }

    #dropOverlay .drop-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 36px 56px;
      border: 2px dashed #38bdf8;
      border-radius: 20px;
      color: #e2e8f0;
      font-size: 34px;
    }

    #dropOverlay .drop-box p {
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header
    class="h-[58px] shrink-0 bg-slate-950 border-b border-slate-700
           flex items-center justify-between px-4"
  >

    <div class="flex items-center gap-3">

      <div
        class="w-9 h-9 rounded-lg bg-sky-500
               flex items-center justify-center"
      >
        <i class="fa-solid fa-headphones text-white"></i>
      </div>

      <div>
        <h1 class="font-bold text-sm md:text-base">
          Shadowing Studio
        </h1>

        <p class="text-[10px] md:text-xs text-slate-400">
          PDF + Audio Practice
        </p>
      </div>

    </div>

    <div class="flex items-center gap-2">

      <!-- PDF INPUT -->
      <input
        id="pdfInput"
        type="file"
        accept="application/pdf,.pdf"
        class="hidden"
      />

      <button
        id="openPdfBtn"
        class="pdf-btn"
        title="PDF ochish"
        type="button"
      >
        <i class="fa-solid fa-file-pdf"></i>
        <span class="hidden sm:inline">PDF</span>
      </button>

      <!-- AUDIO INPUT -->
      <input
        id="audioInput"
        type="file"
        multiple
        accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.webm"
        class="hidden"
      />

      <button
        id="openAudioBtn"
        class="pdf-btn"
        title="Audio ochish (bir nechta tanlash mumkin)"
        type="button"
      >
        <i class="fa-solid fa-music"></i>
        <span class="hidden sm:inline">Audio</span>
      </button>

    </div>

  </header>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <main class="flex flex-col" style="height: calc(100vh - 58px); height: calc(100dvh - 58px);">

    <section class="flex-1 min-h-0 bg-gray-800 flex flex-col">

      <!-- ===================================================
           PDF VIEWER
      ==================================================== -->

      <div id="pdfContainer">

        <!-- Placeholder -->

        <div
          id="pdfPlaceholder"
          class="absolute inset-0 flex items-center justify-center"
        >

          <div class="text-center px-5">

            <div
              class="w-20 h-20 rounded-2xl
                     bg-slate-700/60
                     flex items-center justify-center
                     mx-auto mb-4"
            >
              <i
                class="fa-solid fa-file-pdf
                       text-4xl text-slate-400"
              ></i>
            </div>

            <h2
              class="text-lg font-semibold text-slate-300"
            >
              PDF faylni oching
            </h2>

            <p
              class="text-sm text-slate-500 mt-2"
            >
              Yuqoridagi PDF tugmasi orqali
              hujjat tanlang
            </p>

            <p
              class="text-xs text-slate-600 mt-3"
            >
              Ctrl + O — PDF ochish
            </p>

          </div>

        </div>


        <!-- PDF canvas wrapper -->

        <div id="pdfPageWrapper">

          <!-- Barcha PDF sahifalari shu yerga ketma-ket chiziladi -->
          <div
            id="pdfPagesList"
            class="hidden"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <!-- =======================================================
       FLOATING AUDIO PLAYER
  ======================================================== -->

  <div id="audioPlayerBar">

    <!-- PDF PAGE NAVIGATION -->
     <!-- PDF VERTICAL SCROLL -->

<div
  class="pdf-page-control"
  title="PDF vertikal scroll"
>
  <button
    id="prevPageBtn"
    class="audio-btn"
    title="Oldingi sahifaga"
    type="button"
  >
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <input
    id="pageInput"
    class="audio-page-input"
    type="number"
    min="1"
    value="1"
    title="Sahifa raqami"
    aria-label="PDF sahifa raqami"
    inputmode="numeric"
    autocomplete="off"
  />

  <span class="page-separator">/</span>

  <span
    id="pageCount"
    class="audio-page-count"
  >
    0
  </span>

  <button
    id="nextPageBtn"
    class="audio-btn"
    title="Keyingi sahifaga"
    type="button"
  >
    <i class="fa-solid fa-arrow-right"></i>
  </button>
</div>


    <div class="player-divider"></div>


    <!-- AUDIO CONTROLS -->

    <button
      id="prevAudioBtn"
      class="audio-btn"
      title="Oldingi audio / boshiga (P)"
      type="button"
    >
      <i class="fa-solid fa-backward-step"></i>
    </button>


    <button
      id="playBtn"
      class="audio-btn play-btn"
      title="Play / Pause"
      type="button"
    >
      <i class="fa-solid fa-play"></i>
    </button>


    <button
      id="nextAudioBtn"
      class="audio-btn"
      title="Keyingi audio (N)"
      type="button"
    >
      <i class="fa-solid fa-forward-step"></i>
    </button>

    <!-- PLAYLIST -->

    <button
      id="playlistBtn"
      class="audio-btn"
      title="Playlist (L)"
      type="button"
    >
      <i class="fa-solid fa-list-ul"></i>
      <span id="playlistBadge"></span>
    </button>


    <span id="currentTime">
      0:00
    </span>


    <input
      id="progress"
      class="audio-range"
      type="range"
      min="0"
      max="0"
      step="0.1"
      value="0"
      aria-label="Audio progress"
    />


    <span id="duration">
      0:00
    </span>


    <!-- SPEED -->

    <button
      id="speedBtn"
      class="audio-btn"
      title="Playback speed"
      type="button"
    >
      1x
    </button>


    <!-- MUTE -->

    <button
      id="muteBtn"
      class="audio-btn"
      title="Mute"
      type="button"
    >
      <i class="fa-solid fa-volume-high"></i>
    </button>


    <!-- VOLUME -->

    <input
      id="volume"
      class="audio-range"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1"
      title="Volume"
      aria-label="Volume"
    />


    <!-- NORMAL LOOP -->

    <button
      id="loopBtn"
      class="audio-btn"
      title="Audio Loop"
      type="button"
    >
      <i class="fa-solid fa-repeat"></i>
    </button>


    <!-- A -->

    <button
      id="btnA"
      class="audio-btn"
      title="A nuqta"
      type="button"
    >
      A
    </button>


    <!-- B -->

    <button
      id="btnB"
      class="audio-btn"
      title="B nuqta"
      type="button"
    >
      B
    </button>


    <!-- CLEAR A-B -->

    <button
      id="clearLoopBtn"
      class="audio-btn danger"
      title="A-B loopni tozalash"
      type="button"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>


    <!-- STATUS -->

    <span
      id="audioStatus"
      aria-live="polite"
    ></span>

  </div>


  <!-- =======================================================
       AUDIO ELEMENT
  ======================================================== -->

  <!-- =======================================================
       PLAYLIST PANEL
  ======================================================== -->

  <div
    id="playlistPanel"
    class="hidden"
    role="dialog"
    aria-label="Playlist"
  >

    <div class="playlist-head">

      <span id="playlistTitle">Playlist</span>

      <button
        id="playlistAddBtn"
        class="pl-btn"
        type="button"
        title="Ro'yxatga audio qo'shish"
      >
        <i class="fa-solid fa-plus"></i>
        <span>Qo'shish</span>
      </button>

      <button
        id="playlistAutoBtn"
        class="pl-btn on"
        type="button"
        title="Audio tugagach keyingisiga avtomatik o'tish"
      >
        <i class="fa-solid fa-forward"></i>
        <span>Avto</span>
      </button>

      <button
        id="playlistClearBtn"
        class="pl-btn"
        type="button"
        title="Ro'yxatni tozalash"
      >
        <i class="fa-solid fa-trash"></i>
      </button>

      <button
        id="playlistCloseBtn"
        class="pl-btn"
        type="button"
        title="Yopish"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>

    <ol id="playlistList"></ol>

  </div>

  <!-- Fayl sudrab tashlanganda ko'rinadi -->
  <div id="dropOverlay" aria-hidden="true">
    <div class="drop-box">
      <i class="fa-solid fa-file-pdf"></i>
      <i class="fa-solid fa-music"></i>
      <p>PDF yoki audio faylni shu yerga tashlang</p>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script type="module" src="./js/app.js"></script>

</body>
</html>
